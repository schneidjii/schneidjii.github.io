<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank of Dad — Schneider</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0ede6;color:#1a2a2a;font-size:14px;min-height:100vh}
.header{background:#1a2e2e;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:14px;border-bottom:3px solid #b8962e}
.header-crest{width:44px;height:54px;object-fit:contain}
.header-text h1{font-size:18px;font-weight:700;letter-spacing:.5px;color:#e8d48a}
.header-text p{font-size:11px;color:#7a9a9a;letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.header-date{margin-left:auto;font-size:11px;color:#7a9a9a}
.tab-bar{background:#1a2e2e;border-bottom:1px solid #2e4a4a;padding:0 24px;display:flex;gap:2px;overflow-x:auto}
.tab-btn{padding:11px 15px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:500;color:#7a9a9a;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s}
.tab-btn:hover{color:#e8d48a}
.tab-btn.active{color:#e8d48a;border-bottom-color:#b8962e}
.watermark{position:fixed;bottom:40px;right:40px;width:200px;opacity:.05;pointer-events:none;z-index:0}
.content{padding:24px;max-width:920px;margin:0 auto;position:relative;z-index:1}
.balance-card{background:linear-gradient(135deg,#1a2e2e 0%,#1e3838 100%);color:#fff;border-radius:12px;padding:20px 24px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;border:1px solid #2e4a4a;position:relative;overflow:hidden}
.balance-card-crest{position:absolute;right:-10px;top:-10px;width:110px;height:110px;object-fit:contain;opacity:.1;pointer-events:none}
.balance-name{font-size:18px;font-weight:700;color:#e8d48a}
.balance-amount{font-size:36px;font-weight:700;font-variant-numeric:tabular-nums}
.balance-amount.positive{color:#4ade80}
.balance-amount.negative{color:#f87171}
.add-form{background:#fff;border:1px solid #ddd8ce;border-radius:10px;padding:16px 20px;margin-bottom:20px}
.add-form h3{font-size:11px;font-weight:700;color:#b8962e;margin-bottom:12px;text-transform:uppercase;letter-spacing:.08em}
.form-row{display:flex;gap:8px;flex-wrap:wrap}
.form-row input{padding:8px 12px;border:1px solid #ddd8ce;border-radius:6px;font-size:13px;background:#faf8f4;flex:1;min-width:100px}
.form-row input:focus{outline:none;border-color:#b8962e;background:#fff}
.form-row input[type=number]{max-width:130px}
.form-row input[type=date]{max-width:160px}
.btn-add{padding:8px 18px;background:#1a2e2e;color:#e8d48a;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.btn-add:hover{background:#2e4a4a}
.form-hint{font-size:11px;color:#999;margin-top:8px}
.section-label{font-size:11px;font-weight:700;color:#b8962e;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;border:1px solid #ddd8ce}
th{text-align:left;font-size:11px;font-weight:700;color:#7a6a3a;padding:10px 12px;border-bottom:1px solid #ece8de;background:#faf8f4;text-transform:uppercase;letter-spacing:.04em}
td{padding:9px 12px;border-bottom:1px solid #f0ece4;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:#faf8f4}
.tx-date{color:#aaa;font-size:11px;width:72px}
.tx-amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;width:90px}
.tx-amt.pos{color:#16a34a}
.tx-amt.neg{color:#dc2626}
.tx-bal{text-align:right;color:#999;font-size:12px;width:90px}
.tx-del{text-align:right;width:36px}
.tx-del button{background:none;border:none;cursor:pointer;color:#ccc;padding:3px 6px;border-radius:4px;font-size:13px}
.tx-del button:hover{color:#dc2626;background:#fef2f2}
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:20px}
.dash-card{background:#fff;border:1px solid #ddd8ce;border-radius:10px;padding:14px 18px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.dash-card:hover{border-color:#b8962e;box-shadow:0 2px 8px rgba(184,150,46,.12)}
.dc-name{font-size:12px;color:#7a6a3a;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.dc-bal{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.dc-bal.positive{color:#16a34a}
.dc-bal.negative{color:#dc2626}
.dash-total{background:#1a2e2e;border-radius:10px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.dash-total span{font-size:12px;color:#7a9a9a;font-weight:500}
.dash-total strong{font-size:20px;font-weight:700;color:#e8d48a}
.empty-state{text-align:center;padding:40px;color:#aaa;font-size:13px;background:#fff;border-radius:10px;border:1px solid #ddd8ce}
.btn-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.btn-row button{padding:8px 14px;background:#fff;color:#1a2e2e;border:1px solid #ddd8ce;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
.btn-row button:hover{background:#faf8f4;border-color:#b8962e;color:#b8962e}
.import-area{margin-top:20px;border-top:1px solid #ddd8ce;padding-top:20px;display:none}
.import-area textarea{width:100%;padding:10px;border:1px solid #ddd8ce;border-radius:6px;font-size:12px;font-family:monospace;resize:vertical;background:#faf8f4}
.import-btns{margin-top:8px;display:flex;gap:8px}
.import-btns .btn-primary{padding:7px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;background:#1a2e2e;color:#e8d48a;border:none}
.import-btns .btn-secondary{padding:7px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;background:#fff;color:#666;border:1px solid #ddd8ce}
.kid-tag{font-size:11px;color:#b8962e;margin-right:6px;font-weight:600}
.raw-wrap{overflow-x:auto}
.ts-cell{font-size:10px;color:#aaa;width:130px;white-space:nowrap}
.log-badge{display:inline-block;padding:1px 7px;border-radius:3px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-right:4px}
.log-badge.create{background:#dcfce7;color:#16a34a}
.log-badge.delete{background:#fee2e2;color:#dc2626}
.log-badge.edit{background:#fef3c7;color:#92400e}
.log-badge.reset{background:#e0e7ff;color:#3730a3}
</style>

function loadData(){try{var r=localStorage.getItem(STORAGE_KEY);if(r)return JSON.parse(r);}catch(e){}return null;}
function loadLog(){try{var r=localStorage.getItem(LOG_KEY);if(r)return JSON.parse(r);}catch(e){}return[];}
function saveData(t){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(t));}catch(e){}}
function saveLog(l){try{localStorage.setItem(LOG_KEY,JSON.stringify(l.slice(-2000)));}catch(e){}}

var transactions = loadData() || SEED.map(function(t,i){return Object.assign({},t,{id:'s'+i,createdAt:'2021-01-01T00:00:00.000Z'});});
var auditLog = loadLog();
var activeTab = 'dashboard';

function nowISO(){return new Date().toISOString();}
function fmtTS(iso){if(!iso)return'';var d=new Date(iso);return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'})+' '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});}
function getBalance(kid){return transactions.filter(function(t){return t.kid===kid;}).reduce(function(s,t){return s+t.amount;},0);}
function fmt(n){var v=Math.abs(n).toFixed(2);return(n<0?'-':'')+'$'+parseFloat(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtDate(d){var dt=new Date(d+'T12:00:00');return dt.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function addLog(action,kid,desc,amount,txDate,extra){
  auditLog.push({ts:nowISO(),action:action,kid:kid,desc:desc,amount:amount,txDate:txDate,extra:extra||''});
  saveLog(auditLog);
}

function render(){
  document.getElementById('headerDate').textContent = new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  var tabs = ['dashboard'].concat(KIDS).concat(['rawdata','auditlog']);
  document.getElementById('tabBar').innerHTML = tabs.map(function(t){
    var lbl = t==='dashboard'?'Overview':t==='rawdata'?'Raw Data':t==='auditlog'?'Audit Log':t;
    return '<button class="tab-btn'+(activeTab===t?' active':'')+'" data-tab="'+t+'">'+lbl+'</button>';
  }).join('');
  var c = document.getElementById('tabContent');
  if(activeTab==='dashboard') c.innerHTML = renderDashboard();
  else if(activeTab==='rawdata') c.innerHTML = renderRaw();
  else if(activeTab==='auditlog') c.innerHTML = renderAuditLog();
  else c.innerHTML = renderKid(activeTab);
}

function renderDashboard(){
  var total = KIDS.reduce(function(s,k){return s+getBalance(k);},0);
  var cards = KIDS.map(function(k){
    var b=getBalance(k), cls=b>=0?'positive':'negative';
    return '<div class="dash-card" data-tab="'+k+'"><div class="dc-name">'+esc(k)+'</div><div class="dc-bal '+cls+'">'+fmt(b)+'</div></div>';
  }).join('');
  var recent = transactions.slice().sort(function(a,b){return b.date.localeCompare(a.date);}).slice(0,12);
  var rows = recent.map(function(t){
    return '<tr><td class="tx-date">'+fmtDate(t.date)+'</td><td style="overflow:hidden;text-overflow:ellipsis"><span class="kid-tag">'+esc(t.kid)+'</span>'+esc(t.desc)+'</td><td class="tx-amt '+(t.amount>=0?'pos':'neg')+'">'+fmt(t.amount)+'</td></tr>';
  }).join('');
  return '<div class="dashboard-grid">'+cards+'</div>'
    +'<div class="dash-total"><span>Total across all accounts</span><strong>'+fmt(total)+'</strong></div>'
    +'<div class="section-label">12 most recent transactions</div>'
    +'<table><colgroup><col style="width:72px"><col><col style="width:90px"></colgroup>'
    +'<thead><tr><th>Date</th><th>Description</th><th style="text-align:right">Amount</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>';
}

function renderAuditLog(){
  var sorted = auditLog.slice().reverse();
  if(!sorted.length) return '<div class="empty-state">No audit events yet. All future creates, edits, and deletions will appear here.</div>';
  var rows = sorted.map(function(e){
    var bc = e.action==='CREATE'?'create':e.action==='DELETE'?'delete':e.action==='RESET'?'reset':'edit';
    var badge = '<span class="log-badge '+bc+'">'+e.action+'</span>';
    return '<tr>'
      +'<td class="ts-cell">'+fmtTS(e.ts)+'</td>'
      +'<td>'+badge+'</td>'
      +'<td style="font-size:12px;color:#b8962e;font-weight:600;white-space:nowrap">'+esc(e.kid)+'</td>'
      +'<td style="overflow:hidden;text-overflow:ellipsis" title="'+esc(e.desc)+'">'+esc(e.desc)+'</td>'
      +'<td class="tx-amt '+(e.amount>=0?'pos':'neg')+'">'+fmt(e.amount)+'</td>'
      +'<td class="tx-date">'+esc(e.txDate||'')+'</td>'
      +'<td style="font-size:11px;color:#aaa;overflow:hidden;text-overflow:ellipsis">'+esc(e.extra||'')+'</td>'
      +'</tr>';
  }).join('');
  var csvRows = [['Timestamp','Action','Kid','Description','Amount','TxDate','Notes']].concat(sorted.map(function(e){return[e.ts,e.action,e.kid,e.desc,e.amount,e.txDate||'',e.extra||''];}));
  var csv = csvRows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(',');}).join('\n');
  return '<div class="btn-row"><button data-action="exportAuditCSV">&#x2B07; Export Audit Log</button></div>'
    +'<div class="section-label">'+sorted.length+' audit events — newest first</div>'
    +'<div class="raw-wrap"><table><colgroup><col style="width:135px"><col style="width:72px"><col style="width:110px"><col><col style="width:88px"><col style="width:72px"><col style="width:120px"></colgroup>'
    +'<thead><tr><th>Timestamp</th><th>Action</th><th>Kid</th><th>Description</th><th style="text-align:right">Amount</th><th>Tx Date</th><th>Notes</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table></div>'
    +'<textarea id="auditCsvData" style="display:none">'+csv+'</textarea>';
}

function switchTab(t){activeTab=t;render();}
function submitTx(kid){
  var kidId = kid.replace(/ /g,'_');
  var desc = document.getElementById('desc_'+kidId).value.trim();
  var amt = parseFloat(document.getElementById('amt_'+kidId).value);
  var date = document.getElementById('date_'+kidId).value;
  if(!desc||isNaN(amt)||!date){alert('Please fill in all fields.');return;}
  var ts = nowISO();
  transactions.push({id:Date.now()+Math.random(),kid:kid,desc:desc,amount:amt,date:date,createdAt:ts});
  addLog('CREATE',kid,desc,amt,date,'');
  saveData(transactions);
  render();
}
function deleteTx(id){
  var tx = transactions.filter(function(t){return String(t.id)===String(id);})[0];
  if(!tx)return;
  if(!confirm('Delete "'+tx.desc+'" ('+fmt(tx.amount)+') for '+tx.kid+'?'))return;
  addLog('DELETE',tx.kid,tx.desc,tx.amount,tx.date,'Deleted '+fmtTS(nowISO()));
  transactions = transactions.filter(function(t){return String(t.id)!==String(id);});
  saveData(transactions);render();
}

  var csv = document.getElementById('csvData').value;

  a.download = 'bank_of_dad.csv'; a.click();
}

function toggleImport(){
  var el = document.getElementById('importArea');
  if(el) el.style.display = el.style.display==='block'?'none':'block';
}
function importCSV(){
  var lines = document.getElementById('csvInput').value.trim().split('\n').filter(function(l){return l.trim();});
  var added = 0;
  lines.forEach(function(line){
    var parts = line.split(',').map(function(p){return p.replace(/^"|"$/g,'').trim();});
    if(parts.length>=4){
      var date=parts[0],kid=parts[1],desc=parts[2],amt=parseFloat(parts[3]);
      if(KIDS.indexOf(kid)>=0 && !isNaN(amt)){
        var ts=nowISO();
        transactions.push({id:Date.now()+Math.random(),kid:kid,desc:desc,amount:amt,date:date,createdAt:ts});
        addLog('CREATE',kid,desc,amt,date,'Imported via CSV');
        added++;
      }
    }
  });
  saveData(transactions);alert(added+' transaction(s) imported.');render();
}
function resetToSeed(){
  if(!confirm('Reset all data to original spreadsheet values? This cannot be undone.'))return;
  transactions = SEED.map(function(t,i){return Object.assign({},t,{id:'s'+i,createdAt:'2021-01-01T00:00:00.000Z'});});
  addLog('RESET','ALL','Reset to original seed data',0,'','');
  saveData(transactions);render();
}

    var fileHtml = '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">'

      +'<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f0ede6;color:#1a2a2a}'
      +'.hdr{background:#1a2e2e;padding:14px 20px;display:flex;align-items:center;gap:12px;border-bottom:3px solid #b8962e}'
      +'.hc{width:36px;height:44px;object-fit:contain}.ht h1{font-size:16px;font-weight:700;color:#e8d48a}'
      +'.ht p{font-size:10px;color:#7a9a9a;text-transform:uppercase;letter-spacing:.08em}'
      +'.banner{background:#b8962e;color:#1a2e2e;text-align:center;padding:5px;font-size:11px;font-weight:700;letter-spacing:.06em}'
      +'.wrap{padding:20px;max-width:700px;margin:0 auto}'
      +'.bc{background:#1a2e2e;border-radius:10px;padding:18px 20px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}'
      +'.bn{font-size:16px;font-weight:700;color:#e8d48a}.ba{font-size:32px;font-weight:700;'+cls+'}'
      +'table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;border:1px solid #ddd8ce}'
      +'th{text-align:left;font-size:10px;font-weight:700;color:#7a6a3a;padding:9px 10px;border-bottom:1px solid #ece8de;background:#faf8f4;text-transform:uppercase;letter-spacing:.05em}'
      +'td{border-bottom:1px solid #f0ece4}tr:last-child td{border-bottom:none}tr:hover td{background:#faf8f4}'
      +'</style></head><body>'
      +'<div class="hdr"><img class="hc" src="'+CREST_SRC+'" alt=""/><div class="ht"><h1>Bank of Dad</h1><p>Schneider Family</p></div></div>'
      +'<div class="banner">READ-ONLY — '+kid.toUpperCase()+'</div>'
      +'<div class="wrap"><div class="bc"><div class="bn">'+kid+'</div><div class="ba">'+fmt(bal)+'</div></div>'
      +'<table><colgroup><col style="width:72px"><col><col style="width:88px"><col style="width:88px"></colgroup>'
      +'<thead><tr><th>Date</th><th>Description</th><th style="text-align:right">Amount</th><th style="text-align:right">Balance</th></tr></thead>'
      +'<tbody>'+rows+'</tbody></table></div></body></html>';
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([fileHtml],{type:'text/html'}));
    a.download = 'bod_'+kid.replace(/ /g,'_').toLowerCase()+'.html';
    a.click();
  });
}

document.addEventListener('click', function(e) {
  var tb = e.target.closest('[data-tab]');
  if (tb) { activeTab = tb.getAttribute('data-tab'); render(); return; }
  var dl = e.target.closest('[data-del]');
  if (dl) { deleteTx(dl.getAttribute('data-del')); return; }
  var ad = e.target.closest('[data-add]');
  if (ad) { submitTx(ad.getAttribute('data-add')); return; }
  var ac = e.target.closest('[data-action]');
  if (ac) {
    var a = ac.getAttribute('data-action');
    if (a === 'exportCSV') exportCSV();
    else if (a === 'exportAuditCSV') exportAuditCSV();
    else if (a === 'toggleImport') toggleImport();
    else if (a === 'importCSV') importCSV();
    else if (a === 'cancelImport') { var el=document.getElementById('importArea'); if(el) el.style.display='none'; }
    else if (a === 'resetToSeed') resetToSeed();
    else if (a === 'generateKidFiles') generateKidFiles();
  }
});

render();
</script>
</body>
</html>
