<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0ede6; color: #1a2a2a; font-size: 14px; }
#header { background: #1a2e2e; padding: 12px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 3px solid #b8962e; }
#header img { width: 40px; height: 52px; object-fit: contain; }
#header h1 { font-size: 17px; font-weight: 700; color: #e8d48a; }
#header p { font-size: 10px; color: #7a9a9a; text-transform: uppercase; letter-spacing: .08em; }
#header-date { margin-left: auto; font-size: 11px; color: #7a9a9a; }
#tabs { background: #1a2e2e; border-bottom: 1px solid #2e4a4a; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; }
#tabs button { padding: 10px 12px; border: none; background: none; cursor: pointer; font-size: 12px; font-weight: 500; color: #7a9a9a; border-bottom: 2px solid transparent; white-space: nowrap; }
#tabs button.active { color: #e8d48a; border-bottom-color: #b8962e; }
#content { padding: 16px; max-width: 900px; margin: 0 auto; }
.bal-card { background: linear-gradient(135deg,#1a2e2e,#1e3838); border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #2e4a4a; }
.bal-name { font-size: 17px; font-weight: 700; color: #e8d48a; }
.bal-amt { font-size: 32px; font-weight: 700; }
.pos { color: #4ade80; } .neg { color: #f87171; }
.pos-text { color: #16a34a; } .neg-text { color: #dc2626; }
.grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(140px,1fr)); gap: 10px; margin-bottom: 16px; }
.dash-card { background: #fff; border: 1px solid #ddd8ce; border-radius: 10px; padding: 12px 16px; cursor: pointer; }
.dash-card:hover { border-color: #b8962e; }
.dc-name { font-size: 11px; color: #7a6a3a; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
.dc-bal { font-size: 18px; font-weight: 700; }
.total-bar { background: #1a2e2e; border-radius: 10px; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.total-bar span { font-size: 12px; color: #7a9a9a; }
.total-bar strong { font-size: 18px; font-weight: 700; color: #e8d48a; }
.form-box { background: #fff; border: 1px solid #ddd8ce; border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; }
.form-box h3 { font-size: 10px; font-weight: 700; color: #b8962e; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
.form-row { display: flex; gap: 6px; flex-wrap: wrap; }
.form-row input { padding: 7px 10px; border: 1px solid #ddd8ce; border-radius: 6px; font-size: 13px; background: #faf8f4; flex: 1; min-width: 100px; }
.form-row input:focus { outline: none; border-color: #b8962e; }
.btn-add { padding: 7px 14px; background: #1a2e2e; color: #e8d48a; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; }
.hint { font-size: 11px; color: #aaa; margin-top: 6px; }
.sec-label { font-size: 10px; font-weight: 700; color: #b8962e; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #ddd8ce; }
th { text-align: left; font-size: 10px; font-weight: 700; color: #7a6a3a; padding: 9px 10px; border-bottom: 1px solid #ece8de; background: #faf8f4; text-transform: uppercase; letter-spacing: .04em; }
td { padding: 8px 10px; border-bottom: 1px solid #f0ece4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #faf8f4; }
.btn-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.btn { padding: 7px 12px; background: #fff; color: #1a2e2e; border: 1px solid #ddd8ce; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
.btn:hover { border-color: #b8962e; color: #b8962e; }
.del-btn { background: none; border: none; cursor: pointer; color: #ccc; font-size: 13px; padding: 2px 6px; }
.del-btn:hover { color: #dc2626; }
.empty { text-align: center; padding: 32px; color: #aaa; background: #fff; border-radius: 10px; border: 1px solid #ddd8ce; }
.badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 700; text-transform: uppercase; margin-right: 4px; }
.badge-create { background: #dcfce7; color: #16a34a; }
.badge-delete { background: #fee2e2; color: #dc2626; }
.badge-reset { background: #e0e7ff; color: #3730a3; }
.import-box { background: #fff; border: 1px solid #ddd8ce; border-radius: 10px; padding: 14px; margin-bottom: 14px; display: none; }
.import-box textarea { width: 100%; padding: 8px; border: 1px solid #ddd8ce; border-radius: 6px; font-size: 12px; font-family: monospace; resize: vertical; }
.watermark { position: fixed; bottom: 30px; right: 30px; width: 180px; opacity: .05; pointer-events: none; z-index: 0; }
#content { position: relative; z-index: 1; }
</style>

function loadState() {
  try { var r = localStorage.getItem(SK); TX = r ? JSON.parse(r) : SEED.map(function(s,i){ return {id:'s'+i,kid:s[0],desc:s[1],amount:s[2],date:s[3],createdAt:'2021-01-01T00:00:00Z'}; }); } catch(e) { TX = SEED.map(function(s,i){ return {id:'s'+i,kid:s[0],desc:s[1],amount:s[2],date:s[3],createdAt:'2021-01-01T00:00:00Z'}; }); }
  try { var l = localStorage.getItem(LK); LOG = l ? JSON.parse(l) : []; } catch(e) { LOG = []; }
}
function saveState() {
  try { localStorage.setItem(SK, JSON.stringify(TX)); localStorage.setItem(LK, JSON.stringify(LOG.slice(-2000))); } catch(e) {}
}

// ============================================================
// HELPERS
// ============================================================
function fmt(n) { return (n < 0 ? '-' : '') + '$' + Math.abs(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function fmtDate(d) { return new Date(d + 'T12:00:00').toLocaleDateString('en-US', {month:'short',day:'numeric',year:'2-digit'}); }
function fmtTS(iso) { if (!iso) return ''; var d = new Date(iso); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'2-digit'}) + ' ' + d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function bal(kid) { var s = 0; for (var i = 0; i < TX.length; i++) { if (TX[i].kid === kid) s += TX[i].amount; } return s; }
function addLog(action, kid, desc, amount, txDate, extra) { LOG.push({ts: new Date().toISOString(), action:action, kid:kid, desc:desc, amount:amount, txDate:txDate, extra:extra||''}); }
function el(id) { return document.getElementById(id); }
function ce(tag, attrs, text) { var e = document.createElement(tag); if (attrs) { for (var k in attrs) { if (k === 'cls') e.className = attrs[k]; else if (k === 'html') e.innerHTML = attrs[k]; else e.setAttribute(k, attrs[k]); } } if (text !== undefined) e.textContent = text; return e; }

// ============================================================
// RENDER
// ============================================================
function setTab(t) { currentTab = t; render(); }

function render() {
  // Tabs
  var tabBar = el('tabs');
  tabBar.innerHTML = '';
  var allTabs = ['dashboard'].concat(KIDS).concat(['rawdata','auditlog']);
  var labels = {dashboard:'Overview', rawdata:'Raw Data', auditlog:'Audit Log'};
  allTabs.forEach(function(t) {
    var btn = ce('button', {}, labels[t] || t);
    if (t === currentTab) btn.className = 'active';
    btn.addEventListener('click', (function(tab){ return function(){ setTab(tab); }; })(t));
    tabBar.appendChild(btn);
  });

  var c = el('content');
  c.innerHTML = '';

  if (currentTab === 'dashboard') renderDashboard(c);
  else if (currentTab === 'rawdata') renderRaw(c);
  else if (currentTab === 'auditlog') renderAudit(c);
  else renderKid(c, currentTab);
}

function renderDashboard(c) {
  var total = 0;
  var grid = ce('div', {cls:'grid'});
  KIDS.forEach(function(k) {
    var b = bal(k); total += b;
    var card = ce('div', {cls:'dash-card'});
    card.appendChild(ce('div', {cls:'dc-name'}, k));
    var ba = ce('div', {cls:'dc-bal ' + (b >= 0 ? 'pos-text' : 'neg-text')}, fmt(b));
    card.appendChild(ba);
    card.addEventListener('click', (function(kid){ return function(){ setTab(kid); }; })(k));
    grid.appendChild(card);
  });
  c.appendChild(grid);

  var tb = ce('div', {cls:'total-bar'});
  tb.appendChild(ce('span', {}, 'Total across all accounts'));
  tb.appendChild(ce('strong', {}, fmt(total)));
  c.appendChild(tb);

  c.appendChild(ce('div', {cls:'sec-label'}, '12 most recent transactions'));
  var sorted = TX.slice().sort(function(a,b){ return b.date.localeCompare(a.date); }).slice(0,12);
  var tbl = buildTable(['Date','Description','Amount'], sorted.map(function(t){
    return [fmtDate(t.date), '<span style="font-size:10px;color:#b8962e;font-weight:600;margin-right:4px">'+t.kid+'</span>'+t.desc, {text:fmt(t.amount),cls:t.amount>=0?'pos-text':'neg-text',align:'right'}];
  }));
  c.appendChild(tbl);
}

function renderKid(c, kid) {
  var b = bal(kid);
  var bc = ce('div', {cls:'bal-card'});
  bc.appendChild(ce('div', {cls:'bal-name'}, kid));
  bc.appendChild(ce('div', {cls:'bal-amt ' + (b >= 0 ? 'pos' : 'neg')}, fmt(b)));
  c.appendChild(bc);

  // Add form
  var form = ce('div', {cls:'form-box'});
  form.appendChild(ce('h3', {}, 'Add Transaction'));
  var row = ce('div', {cls:'form-row'});
  var dInput = ce('input', {type:'text', placeholder:'Description', id:'inp-desc', style:'flex:2;min-width:140px'});
  var aInput = ce('input', {type:'number', placeholder:'Amount', id:'inp-amt', style:'width:110px', step:'0.01'});
  var dtInput = ce('input', {type:'date', id:'inp-date', style:'width:130px'});
  dtInput.value = new Date().toISOString().split('T')[0];
  var addBtn = ce('button', {cls:'btn-add'}, '+ Add');
  addBtn.addEventListener('click', function() {
    var d = el('inp-desc').value.trim();
    var a = parseFloat(el('inp-amt').value);
    var dt = el('inp-date').value;
    if (!d || isNaN(a) || !dt) { alert('Please fill in all fields.'); return; }
    TX.push({id: Date.now()+Math.random(), kid:kid, desc:d, amount:a, date:dt, createdAt:new Date().toISOString()});
    addLog('CREATE', kid, d, a, dt, '');
    saveState(); setTab(kid);
  });
  row.appendChild(dInput); row.appendChild(aInput); row.appendChild(dtInput); row.appendChild(addBtn);
  form.appendChild(row);
  form.appendChild(ce('div', {cls:'hint'}, 'Use negative numbers for deductions (e.g. -10.00)'));
  c.appendChild(form);

  var kidTx = TX.filter(function(t){ return t.kid === kid; }).sort(function(a,b){ return b.date.localeCompare(a.date); });
  c.appendChild(ce('div', {cls:'sec-label'}, kidTx.length + ' transactions — newest first'));

  if (!kidTx.length) { c.appendChild(ce('div', {cls:'empty'}, 'No transactions yet')); return; }

  var running = b;
  var tbl = document.createElement('table');
  var thead = tbl.createTHead();
  var hrow = thead.insertRow();
  ['Date','Description','Amount','Balance','Created',''].forEach(function(h){ var th = document.createElement('th'); th.textContent = h; hrow.appendChild(th); });
  var tbody = tbl.createTBody();
  kidTx.forEach(function(t) {
    var tb2 = running; running -= t.amount;
    var row = tbody.insertRow();
    var cells = [
      {text: fmtDate(t.date), style:'color:#aaa;font-size:11px;width:68px'},
      {text: t.desc, title: t.desc},
      {text: fmt(t.amount), style:(t.amount>=0?'color:#16a34a':'color:#dc2626')+';text-align:right;font-weight:600;white-space:nowrap'},
      {text: fmt(tb2), style:'text-align:right;color:#999;font-size:12px;white-space:nowrap'},
      {text: fmtTS(t.createdAt), style:'color:#aaa;font-size:10px;white-space:nowrap'},
      {btn: true, id: t.id}
    ];
    cells.forEach(function(cell) {
      var td = row.insertCell();
      if (cell.btn) {
        var db = document.createElement('button');
        db.textContent = '✕';
        db.className = 'del-btn';
        db.addEventListener('click', (function(tid){ return function(){ delTx(tid); }; })(cell.id));
        td.appendChild(db);
        td.style.textAlign = 'right';
      } else {
        td.textContent = cell.text || '';
        if (cell.style) td.style.cssText = cell.style;
        if (cell.title) td.title = cell.title;
      }
    });
  });
  c.appendChild(tbl);
}

function renderRaw(c) {
  var btnRow = ce('div', {cls:'btn-row'});
  var expBtn = ce('button', {cls:'btn'}, '⬇ Export CSV');
  expBtn.addEventListener('click', exportCSV);
  var impBtn = ce('button', {cls:'btn'}, '⬆ Import CSV');
  var resetBtn = ce('button', {cls:'btn'}, '↺ Reset to original');
  resetBtn.addEventListener('click', resetData);
  btnRow.appendChild(expBtn); btnRow.appendChild(impBtn); btnRow.appendChild(resetBtn);
  c.appendChild(btnRow);

  var importBox = ce('div', {cls:'import-box', id:'import-box'});
  var ta = ce('textarea', {rows:'4', placeholder:'2024-01-15,Donald John,Birthday money,20.00'});
  var impRow = ce('div', {cls:'btn-row', style:'margin-top:8px'});
  var doImp = ce('button', {cls:'btn-add', style:'font-size:12px'}, '✓ Import');
  var cancelImp = ce('button', {cls:'btn'}, 'Cancel');
  doImp.addEventListener('click', function() { doImport(ta.value); });
  cancelImp.addEventListener('click', function() { importBox.style.display = 'none'; });
  impRow.appendChild(doImp); impRow.appendChild(cancelImp);
  importBox.appendChild(ce('div', {cls:'sec-label'}, 'Paste CSV — Date, Kid, Description, Amount (no header)'));
  importBox.appendChild(ta); importBox.appendChild(impRow);
  c.appendChild(importBox);
  impBtn.addEventListener('click', function() { importBox.style.display = importBox.style.display === 'block' ? 'none' : 'block'; });

  var all = TX.slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
  c.appendChild(ce('div', {cls:'sec-label'}, all.length + ' total transactions'));

  var wrap = ce('div', {style:'overflow-x:auto'});
  var tbl = document.createElement('table');
  var thead = tbl.createTHead();
  var hrow = thead.insertRow();
  ['Date','Kid','Description','Amount','Created',''].forEach(function(h){ var th = document.createElement('th'); th.textContent = h; hrow.appendChild(th); });
  var tbody = tbl.createTBody();
  all.forEach(function(t) {
    var row = tbody.insertRow();
    [
      {text:fmtDate(t.date), style:'color:#aaa;font-size:11px;width:68px'},
      {text:t.kid, style:'color:#b8962e;font-weight:600;font-size:12px;width:100px'},
      {text:t.desc, title:t.desc},
      {text:fmt(t.amount), style:(t.amount>=0?'color:#16a34a':'color:#dc2626')+';text-align:right;font-weight:600;white-space:nowrap'},
      {text:fmtTS(t.createdAt), style:'color:#aaa;font-size:10px;white-space:nowrap'},
      {btn:true, id:t.id}
    ].forEach(function(cell) {
      var td = row.insertCell();
      if (cell.btn) { var db = document.createElement('button'); db.textContent = '✕'; db.className = 'del-btn'; db.addEventListener('click', (function(tid){ return function(){ delTx(tid); }; })(cell.id)); td.appendChild(db); td.style.textAlign='right'; }
      else { td.textContent = cell.text||''; if(cell.style) td.style.cssText=cell.style; if(cell.title) td.title=cell.title; }
    });
  });
  wrap.appendChild(tbl);
  c.appendChild(wrap);
}

function renderAudit(c) {
  var sorted = LOG.slice().reverse();
  if (!sorted.length) { c.appendChild(ce('div',{cls:'empty'},'No audit events yet.')); return; }
  c.appendChild(ce('div',{cls:'sec-label'}, sorted.length + ' audit events — newest first'));
  var wrap = ce('div',{style:'overflow-x:auto'});
  var tbl = document.createElement('table');
  var thead = tbl.createTHead();
  var hrow = thead.insertRow();
  ['Timestamp','Action','Kid','Description','Amount','Notes'].forEach(function(h){ var th=document.createElement('th'); th.textContent=h; hrow.appendChild(th); });
  var tbody = tbl.createTBody();
  sorted.forEach(function(e) {
    var row = tbody.insertRow();
    var bc = e.action==='CREATE'?'badge-create':e.action==='DELETE'?'badge-delete':'badge-reset';
    [
      {text:fmtTS(e.ts), style:'font-size:10px;color:#aaa;white-space:nowrap'},
      {html:'<span class="badge '+bc+'">'+e.action+'</span>'},
      {text:e.kid, style:'color:#b8962e;font-weight:600;font-size:12px'},
      {text:e.desc, title:e.desc},
      {text:fmt(e.amount), style:(e.amount>=0?'color:#16a34a':'color:#dc2626')+';text-align:right;font-weight:600;white-space:nowrap'},
      {text:e.extra||'', style:'font-size:11px;color:#aaa'}
    ].forEach(function(cell) {
      var td = row.insertCell();
      if (cell.html) td.innerHTML = cell.html;
      else { td.textContent = cell.text||''; if(cell.style) td.style.cssText=cell.style; if(cell.title) td.title=cell.title; }
    });
  });
  wrap.appendChild(tbl);
  c.appendChild(wrap);
}

function buildTable(headers, rows) {
  var tbl = document.createElement('table');
  var thead = tbl.createTHead(); var hrow = thead.insertRow();
  headers.forEach(function(h){ var th=document.createElement('th'); th.textContent=h; hrow.appendChild(th); });
  var tbody = tbl.createTBody();
  rows.forEach(function(cells) {
    var row = tbody.insertRow();
    cells.forEach(function(cell) {
      var td = row.insertCell();
      if (typeof cell === 'object' && cell.html) { td.innerHTML = cell.html; }
      else if (typeof cell === 'object') { td.textContent = cell.text||''; if(cell.cls) td.className=cell.cls; if(cell.align) td.style.textAlign=cell.align; }
      else { td.innerHTML = cell; }
    });
  });
  return tbl;
}

function delTx(id) {
  var tx = null;
  for (var i = 0; i < TX.length; i++) { if (String(TX[i].id) === String(id)) { tx = TX[i]; break; } }
  if (!tx) return;
  if (!confirm('Delete "' + tx.desc + '" (' + fmt(tx.amount) + ') for ' + tx.kid + '?')) return;
  addLog('DELETE', tx.kid, tx.desc, tx.amount, tx.date, 'Deleted ' + fmtTS(new Date().toISOString()));
  TX = TX.filter(function(t){ return String(t.id) !== String(id); });
  saveState(); render();
}

function exportCSV() {
  var rows = [['Date','Kid','Description','Amount','CreatedAt']];
  TX.forEach(function(t){ rows.push([t.date,t.kid,t.desc,t.amount.toFixed(2),t.createdAt||'']); });
  var csv = rows.map(function(r){ return r.map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(','); }).join('\n');
  var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = 'bank_of_dad.csv'; a.click();
}

function doImport(text) {
  var lines = text.trim().split('\n').filter(function(l){ return l.trim(); });
  var added = 0;
  lines.forEach(function(line) {
    var parts = line.split(',').map(function(p){ return p.replace(/^"|"$/g,'').trim(); });
    if (parts.length >= 4 && KIDS.indexOf(parts[1]) >= 0 && !isNaN(parseFloat(parts[3]))) {
      TX.push({id:Date.now()+Math.random(), kid:parts[1], desc:parts[2], amount:parseFloat(parts[3]), date:parts[0], createdAt:new Date().toISOString()});
      addLog('CREATE',parts[1],parts[2],parseFloat(parts[3]),parts[0],'CSV import');
      added++;
    }
  });
  saveState(); alert(added + ' transaction(s) imported.'); render();
}

function resetData() {
  if (!confirm('Reset all data to original values? Cannot be undone.')) return;
  TX = SEED.map(function(s,i){ return {id:'s'+i,kid:s[0],desc:s[1],amount:s[2],date:s[3],createdAt:'2021-01-01T00:00:00Z'}; });
  addLog('RESET','ALL','Reset to seed data',0,'','');
  saveState(); render();
}

// ============================================================
// INIT
// ============================================================
loadState();
render();
</script>
</body>
</html>
